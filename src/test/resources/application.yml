spring:
  profiles:
    active: h2
  datasource:
    url: jdbc:h2:mem:agricure_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

agricure:
  jwt:
    secret: TestOnlyJwtSecretKeyMustBeAtLeastThirtyTwoBytesLong!!
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
